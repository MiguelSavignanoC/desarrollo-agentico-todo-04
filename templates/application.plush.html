<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tareas</title>
    <meta name="csrf-token" content="<%= authenticity_token %>">
    <script>document.documentElement.classList.add("js")</script>
    <link rel="stylesheet" href="/assets/app.css?v=4">
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a href="/" class="app-brand" aria-label="Ir a la lista de tareas">
          <span>todo<span class="brand-dot" aria-hidden="true">.</span></span>
        </a>
        <nav aria-label="Principal">
          <a href="/" class="nav-link" aria-current="true">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="3" />
              <path d="m8 12 3 3 5-6" />
            </svg>
            Tareas
          </a>
        </nav>
      </aside>
      <main class="container">
        <%= partial("flash.plush.html") %>
        <%= yield %>
      </main>
    </div>
    <p class="sr-only" data-live aria-live="polite"></p>
    <div class="toast-region" data-toast-region aria-live="polite" aria-atomic="true"></div>
    <template data-toast-template>
      <div class="toast" role="status">
        <span class="toast-message" data-toast-message></span>
        <button type="button" class="toast-action" data-toast-undo>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          Deshacer
        </button>
        <button type="button" class="toast-close" data-toast-close aria-label="Cerrar aviso" title="Cerrar aviso">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
    </template>
    <script src="/assets/app.js?v=3" defer></script>
  </body>
</html>

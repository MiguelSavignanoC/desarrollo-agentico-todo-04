<fieldset class="palette">
  <legend class="sr-only">Color</legend>
  <%= for (c) in taskColors() { %>
    <label class="swatch color-<%= c.Key %>" title="<%= c.Label %>">
      <input type="radio" class="swatch-input" name="color" value="<%= c.Key %>"<%= if (c.Key == paletteSelected) { %> checked<% } %> id="<%= paletteId %>-color-<%= c.Key %>">
      <span class="sr-only"><%= c.Label %></span>
      <svg class="swatch-check" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12 4 4 8-8" /></svg>
    </label>
  <% } %>
</fieldset>
